<script>
  (function () {
    var loader = document.getElementById('app-loader');
    var hidden = false;
    function hideLoader() {
      if (hidden || !loader) return;
      hidden = true;
      loader.classList.add('done');
      setTimeout(function () { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 700);
    }
    // Fired by the Flutter web engine once the very first frame is painted
    window.addEventListener('flutter-first-frame', hideLoader);
    // Safety net: never trap the visitor on the loader
    setTimeout(hideLoader, 15000);
  })();
</script>
